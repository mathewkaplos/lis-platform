name: Constitution Gate
on:
  pull_request:
    branches: [main]
jobs:
  check-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Block free-text clinical value columns
        run: |
          # Scoped to *.sql only -- db/migrations/meta/*.json is Drizzle's
          # auto-generated snapshot/journal metadata, not a human-authored
          # migration. Its JSON serializes CHECK-constraint SQL as quoted
          # strings (e.g. "value": "(...<> 'text') OR (...value_text...)"),
          # which this regex's naive word-boundary matching flags as a
          # free-text column even when none exists (found via TASK-020,
          # observation.data_type is a proper ENUM per ADR-0006).
          if git diff origin/main...HEAD -- 'db/migrations/*.sql' | grep -E '^\+.*\b(result|value|finding)\b.*\btext\b' ; then
            echo "::error::A migration appears to add a free-text column for clinical data (Law #1). If this is a legitimate non-clinical text field, adjust this check's pattern."
            exit 1
          fi
      - name: Require RLS alongside any new tenant table
        run: |
          # Table names may or may not be double-quoted (Drizzle always quotes,
          # e.g. CREATE TABLE "analyte" (); hand-written SQL often doesn't). The
          # original pattern only matched unquoted names, so it matched zero
          # tables on any Drizzle-generated migration -- silently, since the
          # gate was written. Strip quotes to get the bare identifier, and
          # tolerate optional quotes on the RLS-line match too.
          # The "ENABLE ROW LEVEL SECURITY.*table" alternative below never
          # actually matches real SQL -- ALTER TABLE always puts the table
          # name BEFORE that phrase (ALTER TABLE "x" ENABLE ROW LEVEL
          # SECURITY), never after. Every migration until TASK-022 only ever
          # passed via the "ON table" alternative (CREATE POLICY ... ON
          # "table"). TASK-022 introduces partition child tables that
          # legitimately have no CREATE POLICY of their own (they inherit
          # the parent's single policy per Postgres partitioning semantics)
          # but do have their own correctly-ordered ALTER TABLE ... ENABLE
          # ROW LEVEL SECURITY line -- which neither existing alternative
          # could recognize. Added the correctly-ordered pattern as a third
          # alternative rather than working around it in the migration SQL,
          # same fix-the-gate precedent as TASK-020's meta/*.json finding.
          added_tables=$(git diff origin/main...HEAD -- 'db/migrations/*.sql' | grep -oE '^\+CREATE TABLE "?[A-Za-z0-9_]+"?' | tr -d '"' | awk '{print $NF}' || true)
          for t in $added_tables; do
            if ! git diff origin/main...HEAD -- 'db/migrations/*.sql' | grep -qE "ALTER TABLE \"?$t\"?[[:space:]]*ENABLE ROW LEVEL SECURITY|ENABLE ROW LEVEL SECURITY.*\"?$t\"?|ON \"?$t\"?"; then
              echo "::error::New table '$t' has no RLS policy in this diff (Law #4)."
              exit 1
            fi
          done
