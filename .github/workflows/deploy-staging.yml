name: Deploy to Staging
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lis-platform-api:latest

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lis-platform-web:latest
          # TASK-031: `next build` requiredEnv()s SESSION_SECRET at module
          # load (see apps/web/Dockerfile's own ARG) -- this is a build-time-
          # only placeholder, deliberately NOT secrets.SESSION_SECRET: an ARG
          # persists in the image's layer history (docker history), so the
          # real signing key must never be baked in. The container's actual
          # runtime value comes from the "Pull and restart on droplet" step's
          # .env below, injected fresh at `docker compose up`, never at
          # build time.
          build-args: |
            SESSION_SECRET=docker-build-placeholder-not-a-real-secret

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key
          chmod 600 deploy_key

      # --- NEW: joins this runner onto your tailnet before any SSH/SCP happens ---
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-runner

      # --- NEW: confirms the droplet is actually reachable before we depend on it ---
      - name: Wait for Tailscale connectivity to droplet
        run: tailscale ping -c 3 ${{ secrets.DEPLOY_HOST }}
      # --- end new steps ---

      - name: Strip local/CI-only test user from the realm export for staging
        run: |
          # infra/keycloak/lis-realm.json is the single source of truth for
          # realm/client/scope config, shared with local dev and CI. Its
          # checked-in test-user has a well-known password (test-password) —
          # fine for an ephemeral local/CI container, not for a
          # network-reachable staging droplet. Strip .users at deploy time
          # rather than maintaining a second, drift-prone realm file.
          jq 'del(.users)' infra/keycloak/lis-realm.json > /tmp/lis-realm.staging.json

      - name: Copy compose file and realm config to droplet
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} \
            'mkdir -p /opt/lis/keycloak'
          scp -i deploy_key -o StrictHostKeyChecking=no \
            infra/docker-compose.staging.yml \
            root@${{ secrets.DEPLOY_HOST }}:/opt/lis/docker-compose.yml
          scp -i deploy_key -o StrictHostKeyChecking=no \
            /tmp/lis-realm.staging.json \
            root@${{ secrets.DEPLOY_HOST }}:/opt/lis/keycloak/lis-realm.json

      - name: Pull and restart on droplet
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} '
            cd /opt/lis &&
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" > .env &&
            echo "LIS_APP_DB_PASSWORD=${{ secrets.LIS_APP_DB_PASSWORD }}" >> .env &&
            echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env &&
            echo "KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" >> .env &&
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env &&
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} &&
            docker compose pull &&
            docker compose up -d
          '

      - name: Smoke test
        run: |
          # A flat `sleep 8` false-alarmed once Keycloak started doing a real
          # JVM boot + realm import (post-#189 fix) instead of crash-looping
          # instantly: on the resource-constrained (1 vCPU/1GB) droplet, the
          # stack can take longer than 8s to settle. Retry with backoff
          # instead of guessing a fixed wait.
          ssh -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} '
            for i in $(seq 1 10); do
              if curl -sf http://localhost:4000/health; then
                exit 0
              fi
              echo "health check attempt $i failed, retrying in 5s..."
              sleep 5
            done
            echo "health check did not succeed after 10 attempts"
            exit 1
          '

      - name: Clean up deploy key
        if: always()
        run: rm -f deploy_key
