packages:
  - "apps/*"
  - "packages/*"
overrides:
  vite: 6.4.3
  # world-class-execution-plan-8-2026-09.md Phase 0: apps/api's own explicit
  # dependency on @nestjs/platform-express was removed (nothing in this
  # codebase imports anything Express-platform-specific -- every app
  # bootstraps exclusively via NestFastifyApplication, confirmed by grep),
  # but @nestjs/core and @nestjs/testing both still list it as an *optional*
  # peer dependency, and pnpm's default auto-install-peers behavior installs
  # it regardless -- `peerDependencyRules.ignoreMissing` does not prevent
  # this, confirmed by direct testing, not assumed. Since the dependency
  # itself can't be cleanly excluded from the tree without disabling
  # auto-install-peers workspace-wide (a much broader, riskier change than
  # this one dead, never-invoked adapter warrants), this override instead
  # forces the actually-vulnerable package underneath it -- multer, pinned
  # by @nestjs/platform-express@11.1.28 at exactly 2.2.0 (<2.3.0, the
  # vulnerable range) -- to a patched version. Zero runtime risk: this
  # code path is never exercised by any app in this workspace.
  multer: 2.4.0
  # Phase 0 Security Closure Review (world-class-execution-plan-8-2026-09.md):
  # `@nestjs/platform-fastify@11.1.28` pins `fastify` at exactly `5.10.0`
  # (not a range -- confirmed via `npm view @nestjs/platform-fastify@11.1.28
  # dependencies`), which is the real production runtime instance (every
  # app bootstraps via NestFastifyApplication). fastify@5.10.0 has two real
  # moderate advisories (schema-validation-bypass, X-Forwarded-* spoofing);
  # 5.12.5 is the latest patch on the same 5.x line (no NestJS/Fastify
  # major bump). fastify's own `find-my-way`/`@fastify/ajv-compiler`
  # dependencies are declared as caret ranges already permitting the
  # patched versions below, but overriding them explicitly here keeps
  # resolution deterministic rather than depending on pnpm happening to
  # pick the newest satisfying version.
  fastify: 5.12.5
  # find-my-way (Fastify's own HTTP router -- every request in production
  # is routed through this): 9.6.0 vulnerable (DDoS via HTTP2), patched
  # 9.6.1+, already within fastify's own declared `^9.6.0` range.
  find-my-way: 9.9.0
  # fast-uri (used by @fastify/ajv-compiler, Fastify's schema-validation
  # path, on every schema-validated request): 3.1.4 vulnerable (host-
  # confusion/SSRF-class findings), patched 3.1.6+, already within
  # @fastify/ajv-compiler's own declared `^3.0.0` range -- deliberately
  # staying on the 3.x line rather than jumping to fast-uri 4.x, which
  # would need a matching @fastify/ajv-compiler major bump this review
  # found no evidence is needed.
  fast-uri: 3.1.8
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@sentry/node-cpu-profiler': false
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.6'
  - '@next/eslint-plugin-next@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - eslint-config-next@16.3.6
  - next@16.3.6
injectWorkspacePackages: true
