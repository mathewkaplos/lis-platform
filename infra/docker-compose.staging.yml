# The 25GB root disk (/dev/vda1) filled to 100% -- almost entirely
# Docker images/containers/volumes under /var/lib/docker. A 20GB DigitalOcean
# Block Storage Volume was attached (infra/main.tf's
# digitalocean_volume_attachment.staging_docker_data) and mounted at
# /mnt/volume_nyc1_1785507357628, then Docker's data-root was moved there via
# /etc/docker/daemon.json's `data-root` setting on the droplet itself (not
# expressible in this compose file -- data-root is a dockerd-level setting,
# not a per-project one). Every named volume below (pgdata, etc.) now
# physically lives under that mount transparently -- no path changes needed
# here. See infra/main.tf for the Terraform side of the volume/attachment.
services:
  # TASK-198 follow-up: this droplet is a 1 vCPU/1GB box (infra/main.tf,
  # s-1vcpu-1gb) with zero memory limits set anywhere -- confirmed directly
  # via console access that it OOM'd (free -h: 951Mi/961Mi used, 0B swap)
  # during the migration-bootstrap deploy. Every service below now has an
  # explicit mem_limit so one runaway container (Keycloak's JVM, historically
  # the heaviest) can be OOM-killed on its own instead of starving the whole
  # host. Budget: 192+48+320+128+160 = 848m of ~961Mi total, leaving ~110Mi
  # for the OS/docker daemon -- paired with the swapfile added directly on
  # the droplet (not here; see infra/keycloak/README.md-adjacent note in the
  # deploy workflow) as the safety net for brief overshoots.
  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 192m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lis
    volumes: ["pgdata:/var/lib/postgresql/data"]

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    mem_limit: 48m

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # #188: start-dev is explicitly dev-only per Keycloak's own docs (no TLS,
    # no real hostname enforcement). Production mode (`start`) requires
    # KC_HOSTNAME + a way to know it's behind TLS -- both set below.
    # tailscale serve (configured on the droplet itself, not in this file --
    # see deploy-staging.yml) terminates TLS and forwards X-Forwarded-*
    # headers, so KC_PROXY_HEADERS=xforwarded (not KC_HTTP_ENABLED tricks or
    # a cert mounted into this container) is the correct match.
    command: ["start", "--import-realm"]
    mem_limit: 320m
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Without this, the JVM's default heap sizing (a fraction of *host*
      # memory when no cgroup limit is visible to it, or of the mem_limit
      # above once it is) has historically been the single biggest memory
      # consumer of the 5 services on this droplet. Capped well under
      # mem_limit to leave room for metaspace/thread stacks/native memory.
      JAVA_OPTS_APPEND: "-Xms64m -Xmx224m"
      # #188: the real MagicDNS hostname, discovered fresh at deploy time
      # (deploy-staging.yml) since it isn't knowable in advance -- written
      # into .env alongside the other deploy-time values, same mechanism as
      # LIS_APP_DB_PASSWORD etc. Own port (8443), not a sub-path -- avoids
      # also needing KC_HTTP_RELATIVE_PATH reconfiguration for a one-service
      # win that doesn't matter on a single-box deployment.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_PROXY_HEADERS: xforwarded
    # No ports: mapping -- #188 removed direct host exposure now that
    # tailscale serve fronts this on 8443. Still reachable container-to-
    # container on lis_staging_net (api's JWT-issuer check) without one.
    # Deploy step (deploy-staging.yml) strips the local/CI-only test-user block
    # via jq before this file lands here — staging never receives the
    # checked-in test-password user. See infra/keycloak/README.md.
    volumes: ["./keycloak/lis-realm.json:/opt/keycloak/data/import/lis-realm.json"]

  api:
    image: ghcr.io/mathewkaplos/lis-platform-api:latest
    restart: unless-stopped
    mem_limit: 128m
    environment:
      # NOT the postgres superuser — RLS never applies to a superuser or
      # table-owning role, so the API must connect as lis_app (created by
      # db/migrations/0002_app_role.sql) for tenant isolation to be real.
      # Must be named APP_DATABASE_URL, not DATABASE_URL — apps/api/src/auth/db.ts
      # (TASK-030) reads APP_DATABASE_URL specifically and requiredEnv()s it;
      # matches local .env/.env.example and pr.yml's naming.
      APP_DATABASE_URL: postgresql://lis_app:${LIS_APP_DB_PASSWORD}@postgres:5432/lis
      NODE_ENV: staging
      SENTRY_DSN: ${SENTRY_DSN}
      # #188: must be the same real public URL Keycloak now issues tokens
      # under (KC_HOSTNAME above) -- apps/api/src/auth/jwt-auth.guard.ts
      # checks this as a literal string match against each token's `iss`
      # claim. The old container-internal hostname is no longer correct
      # even though api itself is never browser-facing -- it's a JWT
      # issuer-validation value, not a reachability one.
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
    # No ports: mapping -- #188. apps/web never calls api from the browser
    # (confirmed: no client-side reference to it anywhere in apps/web),
    # only server-to-server on lis_staging_net, which doesn't need one.
    depends_on: [postgres, valkey, keycloak]

  web:
    image: ghcr.io/mathewkaplos/lis-platform-web:latest
    restart: unless-stopped
    mem_limit: 160m
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET}
      # #188 (was the TASK-028 gap this comment used to describe): now the
      # real public URL (KEYCLOAK_PUBLIC_URL/realms/lis, discovered at
      # deploy time -- see deploy-staging.yml), correct for both apps/web's
      # server-side calls (discovery/token-exchange) AND the browser-facing
      # authorization/end-session redirect URLs it builds from this same
      # value -- both now resolve to something a real browser can reach.
      #
      # The related NODE_ENV=production Secure-cookie requirement (confirmed
      # directly last session: a browser silently drops a Secure cookie sent
      # over plain HTTP) is what this whole change unblocks -- tailscale
      # serve now provides the real HTTPS this needed.
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
    # No ports: mapping -- #188 removed direct host exposure now that
    # tailscale serve fronts this on 443 (root path).
    depends_on: [api]

volumes:
  pgdata:

networks:
  # TASK-198: pinned so the deploy workflow's `docker run --network
  # lis_staging_net ... lis-platform-migrator` (used to run migrations
  # against this same stack) can target it deterministically, instead of
  # depending on Compose's project-name-derived default network name.
  default:
    name: lis_staging_net
