name: PR Checks
on:
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Must match db-reset.sh / docker-compose.yml's local DB name ("lis"),
          # not an independent CI-only name — 0002_app_role.sql hardcodes
          # `GRANT CONNECT ON DATABASE "lis"`, and migrations are never edited
          # after the fact, so the database this migration runs against must
          # actually be named "lis" (TASK-026/FEAT-007 finding).
          POSTGRES_DB: lis
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lis
      APP_DATABASE_URL: postgresql://lis_app:lis_app_ci_password@localhost:5432/lis
      # TASK-066 (ADR-0017): the critical-notification escalation job's
      # enumeration-only connection (apps/api/src/critical-notification/
      # scheduler-db.ts requiredEnv()s this at module load, same reasoning
      # as APP_DATABASE_URL above). CI-only value, never a real secret.
      SCHEDULER_DATABASE_URL: postgresql://lis_scheduler:lis_scheduler_ci_password@localhost:5432/lis
      # Matches TASK-028's local docker-compose Keycloak service (also
      # localhost:8080) — same realm-import file, no CI-specific override
      # needed. See infra/keycloak/README.md.
      KEYCLOAK_ISSUER_URL: http://localhost:8080/realms/lis
      # TASK-031: apps/web/auth/secret.ts requiredEnv()s this at module load,
      # and `next build` imports every route module to collect routes — so
      # `pnpm build` fails without this set, same reasoning as
      # APP_DATABASE_URL above. CI-only value, never a real secret — must be
      # >=32 bytes (secret.ts enforces this for real HS256 key material).
      SESSION_SECRET: lis_web_ci_session_secret_at_least_32_bytes_long
      # FEAT-059 (ADR-0051): packages/db/src/case-report-signature.ts
      # requires this at call time (case.controller.ts finalize()/amend()) --
      # same reasoning/enforcement as SESSION_SECRET above (>=32 bytes). CI-only
      # value, never a real secret.
      SIGNING_SECRET: lis_api_ci_signing_secret_at_least_32_bytes_long
      # FEAT-061 (ADR-0052): object-storage.client.ts requiredEnv()s these.
      # Matches docker-compose.yml's local minio service exactly (same
      # ports/credentials) -- CI-only values, never real secrets.
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      OBJECT_STORAGE_BUCKET: lis-images
    steps:
      - uses: actions/checkout@v4
      # No explicit `version:` — read from package.json's "packageManager"
      # field instead (pnpm/action-setup's own documented pattern), so this
      # workflow, the Dockerfiles' `corepack enable`, and local dev all
      # resolve the exact same pnpm version from one place. Specifying both
      # here and in packageManager is a hard error
      # ("Multiple versions of pnpm specified"), found for real (not
      # hypothetical) fixing a Docker-build regression caused by exactly
      # that duplication.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      # TASK-029 (FEAT-008): GitHub Actions `services:` only supports an
      # image's default entrypoint — Keycloak's needs an explicit
      # `start-dev --import-realm` command, which `services:` cannot pass.
      # Run it as a plain background container instead (same image/realm
      # file as local dev), launched early so its ~15s startup overlaps
      # with lint/typecheck/build rather than blocking on its own.
      - run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "${{ github.workspace }}/infra/keycloak/lis-realm.json:/opt/keycloak/data/import/lis-realm.json" \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm
      # FEAT-061: same "services: can't pass a command" limitation as
      # Keycloak above -- MinIO's default entrypoint needs an explicit
      # `server /data --console-address :9001` command. The bucket itself is
      # created by the app's own ImageAttachmentModule.onModuleInit()
      # (ensureBucketExists(), object-storage.client.ts), same as local dev
      # -- no separate CI provisioning step needed.
      - run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address :9001
      - run: pnpm install --frozen-lockfile
      # TASK-030 (FEAT-008): apps/api is the first-ever consumer of a
      # workspace package's real exports (@lis/db) — packages/domain/@lis/ui
      # were already listed as deps elsewhere but never actually imported.
      # @lis/db's package.json points types/main at dist/, so apps/api's
      # own lint (type-aware) and typecheck both need it built first, not
      # just installed — pnpm's own dependency-graph ordering doesn't build
      # a package just because a dependent's script runs.
      - run: pnpm --filter @lis/db build
      # TASK-039 (FEAT-011): same gap as @lis/db above, now hitting
      # @lis/domain too — it went from a placeholder `export {}` to apps/api's
      # second real workspace-package dependency (Zod schemas), and this step
      # was never added when that changed. Without it, apps/api's type-aware
      # lint resolves every import from @lis/domain to TypeScript's "error"
      # type (no built dist/ yet), which @typescript-eslint/no-unsafe-* rules
      # then correctly flag — not a flaky CI issue, a real missing build step
      # (found because it passed locally, where packages/domain had already
      # been built earlier in the same session, and only failed in CI's clean
      # checkout).
      - run: pnpm --filter @lis/domain build
      # TASK-040 (FEAT-011): same gap a third time — @lis/sdk went from a
      # placeholder `export {}` to apps/web's first real workspace-package
      # dependency (a typed API client generated from apps/api's OpenAPI
      # doc). Its own generated `schema.ts` is checked in (ADR-0013 §1 —
      # a visible, diffable contract artifact, not regenerated in CI), so
      # this is a plain build, not a `generate` + build step.
      - run: pnpm --filter @lis/sdk build
      - run: pnpm lint
      - run: pnpm typecheck
      # TASK-026 (FEAT-007): CI's first-ever migrate+seed sequence. Mirrors
      # scripts/db-reset.sh's local sequence exactly (migrate as postgres,
      # set lis_app's password out-of-band, seed as postgres so RLS never
      # gets in the way of the seed itself) rather than inventing a second,
      # CI-only bootstrap path.
      - run: pnpm --filter @lis/db migrate
      - run: psql "$DATABASE_URL" -c "ALTER ROLE lis_app WITH PASSWORD 'lis_app_ci_password';"
      - run: psql "$DATABASE_URL" -c "ALTER ROLE lis_scheduler WITH PASSWORD 'lis_scheduler_ci_password';"
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/chemistry-catalog.sql
      # TASK-071 (FEAT-023): second discipline seed, same placeholder framing.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/haematology-catalog.sql
      # FEAT-022 Part 1 (ADR-0024): SLA targets per priority, not discipline-
      # scoped -- a real gap this workflow's own seed sequence didn't mirror
      # from scripts/db-reset.sh initially (only the local script was
      # updated at first; this step was missing here, causing every
      # worklist.e2e-spec.ts SLA-status test to see no configured sla_target
      # row and silently fall back to 'on_track', a real CI failure this
      # exact addition fixes).
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/sla-targets.sql
      # FEAT-052: third discipline seed (microbiology) -- must run before
      # default-report-templates.sql below, same ordering as the other two.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/microbiology-catalog.sql
      # Issue #705 (EPIC #697): fourth discipline seed (anatomic pathology)
      # -- same ordering as scripts/db-reset.sh (no shared dependency with
      # the other discipline seeds; placed here to keep every discipline
      # catalog grouped before default-report-templates.sql).
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/anatomic-pathology-catalog.sql
      # FEAT-032: default, published report_template_version for every
      # seeded test_definition -- must run after both discipline seeds
      # above (database-design Skill entry #12: wired here separately from
      # scripts/db-reset.sh, not assumed to share one seed sequence).
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/default-report-templates.sql
      # FEAT-054: a real, deliberately-authored culture/antibiogram report
      # layout for ORGID, superseding the generic default above -- must run
      # after it, same ordering as scripts/db-reset.sh.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/culture-report-template.sql
      # FEAT-058: shared synoptic-report-grid analyte, then the two real
      # ICCR-sourced protocols (breast, colorectal) -- common must run
      # first, same ordering as scripts/db-reset.sh.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/synoptic-protocol-common.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/synoptic-protocol-breast.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/synoptic-protocol-colorectal.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/synoptic-protocol-cytology-pap.sql
      # Issue #645: pilot expansion of the synoptic-protocol library -- real,
      # cited CAP protocols (prostate, lung), same ordering as
      # scripts/db-reset.sh.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/synoptic-protocol-prostate.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/synoptic-protocol-lung.sql
      # Issue #667: first concept-block library entry -- must run after
      # colorectal/prostate (reuses their own analytes), same ordering as
      # scripts/db-reset.sh.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/concept-block-regional-lymph-nodes.sql
      # Issue #670: binds colorectal's already-seeded histological_tumor_type
      # response options to their real ICD-O-3 codes, same ordering as
      # scripts/db-reset.sh.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/synoptic-response-option-terminology.sql
      # Issue #551/#668: real, cited CAP breast biomarker panel, linked to
      # the existing seeded breast organ protocol, same ordering as
      # scripts/db-reset.sh.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/synoptic-protocol-breast-biomarker.sql
      # Issue #551/#690: real, cited CAP colon/rectum resection protocol,
      # coexisting with the ICCR colorectal protocol above via #690's
      # disambiguation mechanism, same ordering as scripts/db-reset.sh.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/synoptic-protocol-colon-rectum-cap.sql
      - run: pnpm run-golden-datasets
      - run: pnpm test
      # TASK-029: waits here, not right after launch — gives Keycloak's own
      # ~15s startup the whole lint/typecheck/migrate/seed/test window above
      # to overlap with, instead of a dedicated blocking wait.
      - run: |
          for i in $(seq 1 24); do
            curl -sf http://localhost:8080/realms/lis/.well-known/openid-configuration > /dev/null && exit 0
            sleep 5
          done
          echo "Keycloak did not become ready in time" >&2
          docker logs keycloak
          exit 1
      - run: pnpm --filter api test:e2e
      # FEAT-026: the gateway's own e2e spec needs the same live Keycloak
      # (client-credentials grant, ADR-0026) as apps/api's e2e specs above,
      # but no Postgres -- it doesn't touch the database.
      - run: pnpm --filter gateway test:e2e
      # FEAT-036: apps/interop's own e2e spec is a real MLLP client/server
      # round-trip (node-hl7-server/node-hl7-client) with apps/api itself
      # mocked at global.fetch -- needs neither Postgres nor a live Keycloak,
      # unlike gateway's/api's own e2e specs above.
      - run: pnpm --filter interop test:e2e
      # retro (2026-08-07): enforce that apps/api/openapi.json and
      # packages/sdk/src/schema.ts never silently drift from the code
      # (ADR-0013 §1) -- previously relied entirely on whoever happened to
      # remember to regenerate them each session (see CHANGELOG.md), never
      # actually enforced. Placed after test:e2e so AppModule boots against
      # an already-migrated/seeded DB, same env this job already proved works.
      - run: pnpm --filter api generate-openapi
      - run: pnpm --filter @lis/sdk generate
      - run: |
          if ! git diff --exit-code -- apps/api/openapi.json packages/sdk/src/schema.ts; then
            echo "::error::apps/api/openapi.json or packages/sdk/src/schema.ts is out of date. Run 'pnpm --filter api generate-openapi && pnpm --filter @lis/sdk generate' and commit the result."
            exit 1
          fi
      - run: pnpm build

  # Coverage-improvement pass (2026-08-22): TASK-024's real, live
  # cross-table RLS isolation check (45 tenant-scoped tables) existed but
  # was manual-only. Its own header comment previously said this was
  # "deliberately NOT wired into CI" because CI had no DATABASE_URL/
  # migration step at all yet -- that caveat went stale as of TASK-026, but
  # wiring it into build-and-test directly (tried first) turned out to be
  # wrong: `liveLeakCheck`'s own design assumes "TENANT_B is deliberately
  # never written to by anything," which is true against a freshly
  # seeded-only database but false the moment any of the dozens of real
  # e2e specs that legitimately exercise cross-tenant isolation (test-user-2
  # = TENANT_B) have run first -- their own real writes to patient/order/
  # observation/control_lot/etc. under TENANT_B then look indistinguishable
  # from an RLS leak to this check's blind `count(*) != 0`. Confirmed live,
  # not guessed: build-and-test's own shared, accumulating Postgres failed
  # this check on exactly the tables e2e specs are known to write real
  # TENANT_B data to, with counts matching what those specs create -- not a
  # connection-pooling artifact (ruled out first, kept the `{ max: 1 }` fix
  # as good hygiene regardless, but it wasn't the actual cause). A
  # dedicated job with its own fresh, single-purpose Postgres (same
  # `services:` pattern as build-and-test's own) sidesteps this cleanly:
  # neither tenant has ever been touched by anything except this seed +
  # this check, so the check's own "TENANT_B stays empty" assumption is
  # actually true here -- same isolation principle storybook-a11y already
  # gets its own job for, applied to a check that's fundamentally testing
  # something orthogonal to functional e2e correctness too.
  rls-isolation-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lis
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lis
      APP_DATABASE_URL: postgresql://lis_app:lis_app_ci_password@localhost:5432/lis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lis/db build
      - run: pnpm --filter @lis/db migrate
      - run: psql "$DATABASE_URL" -c "ALTER ROLE lis_app WITH PASSWORD 'lis_app_ci_password';"
      # chemistry-catalog -- the check's own fixture setup reuses that
      # seed's fixed tenant's test_definition/analyte/unit rows (its own
      # header comment), nothing from any other discipline seed.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/chemistry-catalog.sql
      # sla-targets / default-report-templates -- found live (this job's own
      # first run): the check discovers every tenant-scoped table
      # structurally and checks all of them, but never inserts its own
      # fixture for report_template/report_template_version/sla_target --
      # it relies on these already existing from the normal seed sequence
      # (default-report-templates.sql needs chemistry-catalog's own
      # test_analyte rows already seeded above, matching its own "every test
      # with at least one test_analyte" logic).
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/sla-targets.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/default-report-templates.sql
      - run: pnpm --filter @lis/db rls-check

  # TASK-037: CI-enforcing a11y check on the 6 design-system primitives (packages/ui).
  # Independent of build-and-test above -- no Postgres/Keycloak needed, this is
  # packages/ui-only. Runs inside the official Playwright image specifically to avoid
  # needing a manual `playwright install --with-deps` step (this repo's own local dev
  # sandbox hit a missing-system-library wall trying that during TASK-034/035 -- the
  # prebuilt image sidesteps it entirely on a GitHub-hosted runner too).
  storybook-a11y:
    runs-on: ubuntu-latest
    container:
      # Must match the playwright-core version this package's own devDependencies resolve
      # to (`pnpm why playwright-core`) -- a mismatched image/client version is a real,
      # documented Playwright footgun (browser protocol version drift).
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      # No explicit `version:` — read from package.json's "packageManager"
      # field instead (pnpm/action-setup's own documented pattern), so this
      # workflow, the Dockerfiles' `corepack enable`, and local dev all
      # resolve the exact same pnpm version from one place. Specifying both
      # here and in packageManager is a hard error
      # ("Multiple versions of pnpm specified"), found for real (not
      # hypothetical) fixing a Docker-build regression caused by exactly
      # that duplication.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lis/ui build-storybook --quiet
      # concurrently/http-server/wait-on/test-storybook are packages/ui-local
      # devDependencies, not hoisted to the workspace root (pnpm's default strict
      # node_modules) -- `pnpm --filter @lis/ui exec` resolves them correctly, a bare
      # `npx <pkg>` from the repo root would not find them locally.
      - working-directory: packages/ui
        run: |
          pnpm exec concurrently -k -s first -n "SB,TEST" \
            "pnpm exec http-server storybook-static --port 6006 --silent" \
            "pnpm exec wait-on tcp:127.0.0.1:6006 && pnpm exec test-storybook --url http://127.0.0.1:6006"
