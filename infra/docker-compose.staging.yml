services:
  # TASK-198 follow-up: this droplet is a 1 vCPU/1GB box (infra/main.tf,
  # s-1vcpu-1gb) with zero memory limits set anywhere -- confirmed directly
  # via console access that it OOM'd (free -h: 951Mi/961Mi used, 0B swap)
  # during the migration-bootstrap deploy. Every service below now has an
  # explicit mem_limit so one runaway container (Keycloak's JVM, historically
  # the heaviest) can be OOM-killed on its own instead of starving the whole
  # host. Budget: 192+48+320+128+160 = 848m of ~961Mi total, leaving ~110Mi
  # for the OS/docker daemon -- paired with the swapfile added directly on
  # the droplet (not here; see infra/keycloak/README.md-adjacent note in the
  # deploy workflow) as the safety net for brief overshoots.
  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 192m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lis
    volumes: ["pgdata:/var/lib/postgresql/data"]

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    mem_limit: 48m

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    mem_limit: 320m
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Without this, the JVM's default heap sizing (a fraction of *host*
      # memory when no cgroup limit is visible to it, or of the mem_limit
      # above once it is) has historically been the single biggest memory
      # consumer of the 5 services on this droplet. Capped well under
      # mem_limit to leave room for metaspace/thread stacks/native memory.
      JAVA_OPTS_APPEND: "-Xms64m -Xmx224m"
    ports: ["8080:8080"]
    # Deploy step (deploy-staging.yml) strips the local/CI-only test-user block
    # via jq before this file lands here — staging never receives the
    # checked-in test-password user. See infra/keycloak/README.md.
    volumes: ["./keycloak/lis-realm.json:/opt/keycloak/data/import/lis-realm.json"]

  api:
    image: ghcr.io/mathewkaplos/lis-platform-api:latest
    restart: unless-stopped
    mem_limit: 128m
    environment:
      # NOT the postgres superuser — RLS never applies to a superuser or
      # table-owning role, so the API must connect as lis_app (created by
      # db/migrations/0002_app_role.sql) for tenant isolation to be real.
      # Must be named APP_DATABASE_URL, not DATABASE_URL — apps/api/src/auth/db.ts
      # (TASK-030) reads APP_DATABASE_URL specifically and requiredEnv()s it;
      # matches local .env/.env.example and pr.yml's naming.
      APP_DATABASE_URL: postgresql://lis_app:${LIS_APP_DB_PASSWORD}@postgres:5432/lis
      NODE_ENV: staging
      SENTRY_DSN: ${SENTRY_DSN}
      # Internal Docker-network hostname, matching every other inter-service
      # reference in this file (postgres:5432, etc.). Assumes Keycloak's own
      # inferred `iss` claim matches this hostname — true only because
      # staging is Tailscale-only today, not exposed on a public domain
      # behind a reverse proxy yet. Revisit alongside the already-flagged
      # start-dev/TLS hardening gap (TASK-028) before any public exposure.
      KEYCLOAK_ISSUER_URL: http://keycloak:8080/realms/lis
    ports: ["4000:4000"]
    depends_on: [postgres, valkey, keycloak]

  web:
    image: ghcr.io/mathewkaplos/lis-platform-web:latest
    restart: unless-stopped
    mem_limit: 160m
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET}
      # Same internal-hostname caveat as api's KEYCLOAK_ISSUER_URL above,
      # but with a real consequence here: apps/web builds both server-side
      # (discovery/token-exchange) AND browser-facing (authorization/
      # end-session redirect) URLs from this one value. A container-internal
      # hostname is correct for the former and unreachable for the latter —
      # RP-initiated login/logout will not actually complete against a real
      # external browser until the start-dev/KC_HOSTNAME hardening TASK-028
      # already flagged is done (infra/keycloak/README.md). Not solved here;
      # local dev (single shared localhost:8080) is unaffected and is what
      # this task's AC was verified against.
      #
      # A second, related consequence of the same "no TLS yet" gap: with
      # NODE_ENV=production (set above), apps/web's session/pkce cookies are
      # correctly marked Secure -- which a browser will silently refuse to
      # store/send back over plain HTTP. Confirmed directly (docker run
      # against this image with NODE_ENV=production, real Set-Cookie header
      # inspected). Not a bug in the cookie logic -- Secure-over-HTTPS-only
      # is the correct behavior for any real deployment; it just means login
      # cannot work end-to-end on staging until real TLS termination exists,
      # same gap, not a second one to separately track.
      KEYCLOAK_ISSUER_URL: http://keycloak:8080/realms/lis
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:

networks:
  # TASK-198: pinned so the deploy workflow's `docker run --network
  # lis_staging_net ... lis-platform-migrator` (used to run migrations
  # against this same stack) can target it deterministically, instead of
  # depending on Compose's project-name-derived default network name.
  default:
    name: lis_staging_net
