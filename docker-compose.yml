services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lis
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      ["./infra/keycloak/lis-realm.json:/opt/keycloak/data/import/lis-realm.json"]
  # FEAT-061: self-hosted, S3-API-compatible object storage for image
  # attachments (KB-06: "Big binaries -> object storage, referenced by row")
  # -- same plain-container pattern as postgres/valkey/keycloak above, no
  # external cloud account needed (proposal §5/§10 Q1). apps/api talks to it
  # via the real @aws-sdk/client-s3 (object-storage.client.ts), so a future
  # move to real cloud S3 is a config change, not a rewrite.
  # `minio/minio` on Docker Hub was removed/deprecated upstream (confirmed
  # 2026-09-23: `docker pull minio/minio:latest` -> "repository does not
  # exist" on both a real CI runner and a local machine) -- moved to quay.io.
  # `quay.io/minio/minio` itself then stopped being pullable anonymously
  # (confirmed 2026-09-25: every tag, not just `:latest`, returns
  # `401 Unauthorized`; MinIO's own binary CDN, dl.min.io, separately
  # confirms the open-source Server/Client/KES projects are archived and no
  # longer maintained) -- see ADR-0056 for the full finding. This is now our
  # own re-hosted copy of the exact last-known-good image (content-identical:
  # all 9 RootFS layer digests match `quay.io/minio/minio@sha256:
  # 14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e` byte
  # for byte, confirmed by direct comparison), not a different MinIO version
  # and not a different product -- a continuity stopgap, not an upgrade.
  minio:
    image: ghcr.io/mathewkaplos/lis-platform-minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
volumes:
  pgdata:
  miniodata:
