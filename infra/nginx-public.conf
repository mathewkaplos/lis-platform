# Manual, OPT-IN nginx config for persistent public-domain access to the
# lis-staging droplet. Not referenced by anything in .github/workflows/ --
# copied to the droplet by hand and used only via
# infra/docker-compose.lis-public.yml. See
# docs/plans/task-persistent-public-domain-access-lis-staging.md for the
# full runbook.
#
# Reachable only from siamas-caddy-1 (joined to this compose project's own
# network -- see docker-compose.lis-public.yml's own comment), which
# terminates real TLS for lis-staging.duckdns.org and proxies here in plain
# HTTP -- standard Caddy reverse_proxy pattern, no host port published.
# Fronts exactly two upstreams:
#   - apps/web (the app itself)
#   - Keycloak's browser-facing OIDC + login-theme endpoints only
#     (/realms, /resources) -- never /admin, which stays reachable only via
#     the existing 127.0.0.1:8080 binding.
server {
    listen 80;
    server_name _;

    location /realms/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /resources/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # apps/web's OIDC callback sets multiple large cookies (session +
        # PKCE/state) in one response -- nginx's 4k/8k default header
        # buffers are too small for that combined Set-Cookie size, causing
        # "upstream sent too big header" / 502 specifically on
        # /api/auth/callback. Confirmed live 2026-10-12.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }
}
