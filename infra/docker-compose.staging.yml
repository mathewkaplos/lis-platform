services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lis
    volumes: ["pgdata:/var/lib/postgresql/data"]

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped

  api:
    image: ghcr.io/mathewkaplos/lis-platform-api:latest
    restart: unless-stopped
    environment:
      # NOT the postgres superuser — RLS never applies to a superuser or
      # table-owning role, so the API must connect as lis_app (created by
      # db/migrations/0002_app_role.sql) for tenant isolation to be real.
      DATABASE_URL: postgresql://lis_app:${LIS_APP_DB_PASSWORD}@postgres:5432/lis
      NODE_ENV: staging
      SENTRY_DSN: ${SENTRY_DSN}
    ports: ["4000:4000"]
    depends_on: [postgres, valkey]

  web:
    image: ghcr.io/mathewkaplos/lis-platform-web:latest
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
