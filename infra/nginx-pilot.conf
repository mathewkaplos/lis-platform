# Manual, OPT-IN nginx config for temporary public-IP pilot/phone testing of
# the lis-staging droplet. Not referenced by anything in .github/workflows/
# -- copied to the droplet by hand and used only via
# infra/docker-compose.pilot.yml. See docs/pilot-remote-access.md for the
# full runbook.
#
# Fronts exactly two upstreams on one public port (80) so the DigitalOcean
# firewall needs no new rule (80 is already open in infra/main.tf):
#   - apps/web (the app itself)
#   - Keycloak's browser-facing OIDC + login-theme endpoints only
#     (/realms, /resources) -- never /admin, which stays reachable only via
#     the existing 127.0.0.1:8080 binding.
server {
    listen 80;
    server_name _;

    location /realms/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /resources/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
