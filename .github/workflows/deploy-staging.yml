name: Deploy to Staging
on:
  push:
    branches: [main]
    # A pure documentation/breadcrumb merge has no effect on the deployed
    # application, but until this filter existed every one still re-ran the
    # full build-and-push + droplet redeploy pipeline -- on a 1vCPU/1GB
    # droplet that has shown real Keycloak-readiness variance under normal
    # conditions. Confirmed 2026-08-03: a docs-only breadcrumb-refresh PR's
    # merge triggered exactly this redeploy, which hit that readiness
    # timeout and took real staging down (api/web stopped, never
    # restarted) until a human noticed and a rerun fixed it. Root-scoped
    # *.md (not **/*.md) so a PR touching both code and a nested package
    # README still triggers normally. .claude/** added 2026-08-05: a
    # Skill-file-only change (PR #307, zero application-code diff)
    # triggered the exact same unnecessary redeploy this filter exists to
    # avoid -- harmless that time, but real wasted CI/deploy time, and this
    # project's own standing rule requires same-day Skill updates routinely.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # FEAT-050 (ADR-0044): a second, immutable tag alongside :latest --
          # :latest gets overwritten every deploy and the droplet prunes its
          # own local images on every deploy too, so without this tag no
          # prior version is ever addressable again once a new one deploys.
          # This tag is what rollback-staging.yml pulls.
          tags: |
            ghcr.io/${{ github.repository_owner }}/lis-platform-api:latest
            ghcr.io/${{ github.repository_owner }}/lis-platform-api:${{ github.sha }}

      - name: Build and push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: base
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lis-platform-migrator:latest
          # TASK-198: the Dockerfile's `base` stage already runs a full
          # `pnpm install` (all devDependencies, including tsx/drizzle-kit)
          # and builds @lis/db, before the prod-only `deploy --prod` step
          # that produces the slim api runtime image. That stage, pushed on
          # its own, is a ready-made image for running `pnpm --filter @lis/db
          # migrate` against staging Postgres -- no separate Dockerfile needed.
          # No git-SHA tag here (FEAT-050/ADR-0044): rollback is
          # application-image-only and deliberately never re-runs migrate --
          # see rollback-staging.yml's own header comment.

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # FEAT-050 (ADR-0044): same second immutable tag as api above.
          tags: |
            ghcr.io/${{ github.repository_owner }}/lis-platform-web:latest
            ghcr.io/${{ github.repository_owner }}/lis-platform-web:${{ github.sha }}
          # TASK-031: `next build` requiredEnv()s SESSION_SECRET at module
          # load (see apps/web/Dockerfile's own ARG) -- this is a build-time-
          # only placeholder, deliberately NOT secrets.SESSION_SECRET: an ARG
          # persists in the image's layer history (docker history), so the
          # real signing key must never be baked in. The container's actual
          # runtime value comes from the "Pull and restart on droplet" step's
          # .env below, injected fresh at `docker compose up`, never at
          # build time.
          build-args: |
            SESSION_SECRET=docker-build-placeholder-not-a-real-secret

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key
          chmod 600 deploy_key

      - name: Strip local/CI-only test user from the realm export for staging
        run: |
          # infra/keycloak/lis-realm.json is the single source of truth for
          # realm/client/scope config, shared with local dev and CI. Its
          # checked-in test-user has a well-known password (test-password) —
          # fine for an ephemeral local/CI container, not for a
          # network-reachable staging droplet. Strip .users at deploy time
          # rather than maintaining a second, drift-prone realm file.
          jq 'del(.users)' infra/keycloak/lis-realm.json > /tmp/lis-realm.staging.json

      - name: Copy compose file and realm config to droplet
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} \
            'mkdir -p /opt/lis/keycloak /opt/lis/seed /opt/lis/scripts'
          scp -i deploy_key -o StrictHostKeyChecking=no \
            infra/docker-compose.staging.yml \
            root@${{ secrets.DEPLOY_HOST }}:/opt/lis/docker-compose.yml
          scp -i deploy_key -o StrictHostKeyChecking=no \
            /tmp/lis-realm.staging.json \
            root@${{ secrets.DEPLOY_HOST }}:/opt/lis/keycloak/lis-realm.json
          # task-remove-tailscale-fix-onboarding-role-mapper (2026-10-17):
          # public-domain access (https://${{ secrets.STAGING_PUBLIC_DOMAIN }},
          # fronted by the siamas app's own Caddy container -- see
          # infra/docker-compose.lis-public.yml's own header comment for the
          # full design) used to be a manual, opt-in overlay, applied and
          # reapplied by hand after every deploy -- which is exactly what
          # broke repeatedly: a normal deploy recreates keycloak/api/web from
          # docker-compose.yml alone, silently dropping this overlay's
          # extra_hosts entries until someone noticed the site was
          # unreachable and reapplied it manually. Copied and reapplied
          # automatically every deploy now, same as every other config file
          # above.
          scp -i deploy_key -o StrictHostKeyChecking=no \
            infra/docker-compose.lis-public.yml \
            root@${{ secrets.DEPLOY_HOST }}:/opt/lis/docker-compose.lis-public.yml
          scp -i deploy_key -o StrictHostKeyChecking=no \
            infra/nginx-public.conf \
            root@${{ secrets.DEPLOY_HOST }}:/opt/lis/nginx-public.conf
          scp -i deploy_key -o StrictHostKeyChecking=no \
            db/seed/chemistry-catalog.sql \
            root@${{ secrets.DEPLOY_HOST }}:/opt/lis/seed/chemistry-catalog.sql
          scp -i deploy_key -o StrictHostKeyChecking=no \
            db/seed/haematology-catalog.sql \
            root@${{ secrets.DEPLOY_HOST }}:/opt/lis/seed/haematology-catalog.sql
          scp -i deploy_key -o StrictHostKeyChecking=no \
            db/seed/microbiology-catalog.sql \
            root@${{ secrets.DEPLOY_HOST }}:/opt/lis/seed/microbiology-catalog.sql
          scp -i deploy_key -o StrictHostKeyChecking=no \
            infra/scripts/backup-staging-db.sh \
            root@${{ secrets.DEPLOY_HOST }}:/opt/lis/scripts/backup-staging-db.sh
          scp -i deploy_key -o StrictHostKeyChecking=no \
            infra/scripts/restore-drill.sh \
            root@${{ secrets.DEPLOY_HOST }}:/opt/lis/scripts/restore-drill.sh
          scp -i deploy_key -o StrictHostKeyChecking=no \
            infra/scripts/restore-drill-compose.yml \
            root@${{ secrets.DEPLOY_HOST }}:/opt/lis/scripts/restore-drill-compose.yml
          ssh -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} \
            'chmod +x /opt/lis/scripts/restore-drill.sh /opt/lis/scripts/backup-staging-db.sh'

      - name: Pull and restart on droplet
        run: |
          # TASK-198 follow-up #2: both prior runs of this step silently
          # truncated right after `docker compose up -d postgres` -- the
          # step still reported success, but migrate/ALTER ROLE/seed/the
          # final `up -d` never ran. Root cause: `bash -s <<'REMOTE'` reads
          # this whole script from its own stdin, and `docker compose exec -T`
          # (used by the pg_isready loop right where both runs died) still
          # forwards the parent shell's stdin into the container by default
          # -- `-T` only disables the pseudo-TTY, not stdin attachment. That
          # silently consumed the *rest of this script* (everything after
          # the loop), so bash hit EOF on its own remaining input and exited
          # 0, having done nothing wrong that it could see. Fix: `< /dev/null`
          # on every inner command that doesn't deliberately need real stdin
          # (the seed step keeps its own explicit `< seed/....sql` redirect,
          # which already safely overrides the inherited stdin for that one
          # command). This is a plain shell-scripting bug, not droplet OOM or
          # Tailscale flakiness -- both prior runs died at the exact same
          # line for the exact same reason, independent of the OOM fix.
          ssh -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/lis

          # task-remove-tailscale-fix-onboarding-role-mapper (2026-10-17):
          # previously discovered fresh every deploy via `tailscale status
          # --self --json` (the droplet's Tailscale MagicDNS hostname) --
          # removed along with every other Tailscale dependency in this
          # pipeline. The real public domain is fixed and already live
          # (infra/docker-compose.lis-public.yml, fronted by the siamas
          # app's own Caddy container). Stored as a repo *secret* (not a
          # variable, despite the hostname itself not being sensitive) --
          # matches where it was actually added under repo Settings; GitHub
          # Actions treats the two contexts identically here, this is a
          # storage-location choice, not a functional one.
          #
          # Unlike the old Tailscale setup (a separate :8443 listener for
          # Keycloak via `tailscale serve`), Keycloak is reached under the
          # *same* domain/port as the app here -- infra/nginx-public.conf
          # routes /realms/ and /resources/ to keycloak:8080 on the one
          # public listener `web` also uses. No port distinction needed.
          if [ -z "${{ secrets.STAGING_PUBLIC_DOMAIN }}" ]; then
            echo "secrets.STAGING_PUBLIC_DOMAIN is not set -- add it under repo Settings -> Secrets and variables -> Actions -> Secrets (e.g. lis-staging.duckdns.org, no scheme)" >&2
            exit 1
          fi
          PUBLIC_APP_URL="https://${{ secrets.STAGING_PUBLIC_DOMAIN }}"
          KEYCLOAK_PUBLIC_URL="$PUBLIC_APP_URL"
          KEYCLOAK_ISSUER_URL="${KEYCLOAK_PUBLIC_URL}/realms/lis"
          # apps/web's OIDC login/logout routes need this too -- self-hosted
          # Next.js standalone mode has no working way to trust the incoming
          # Host header in this Next version (confirmed by inspecting the
          # built required-server-files.json directly: experimental.
          # trustHostHeader is silently dropped by config validation), so
          # request.nextUrl.origin resolves to the web container's own
          # Docker-assigned hostname instead of this real one -- broke the
          # OIDC redirect_uri, which Keycloak then rejected outright.

          cat > .env <<'ENVEOF'
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          LIS_APP_DB_PASSWORD=${{ secrets.LIS_APP_DB_PASSWORD }}
          SCHEDULER_DB_PASSWORD=${{ secrets.SCHEDULER_DB_PASSWORD }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          # FEAT-059 (ADR-0051): apps/api-side, read lazily per call (not at
          # module load, unlike SESSION_SECRET's Next.js build-time
          # requiredEnv()) -- its absence fails the specific finalize/amend
          # request, not a container crash-loop, but must still be a real
          # secret before staging sign-out is exercised for real.
          SIGNING_SECRET=${{ secrets.SIGNING_SECRET }}
          # Per-tenant email delivery follow-up: AES-256-GCM key encrypting
          # each org's own Gmail app password at rest (packages/db/src/
          # secret-encryption.ts). Same "new secret, must be added under
          # repo Settings -> Secrets before this deploy step has a real
          # value" convention as MINIO_ROOT_PASSWORD below -- generate with
          # `openssl rand -hex 32` (exactly 32 bytes, hex-encoded).
          SETTINGS_ENCRYPTION_KEY=${{ secrets.SETTINGS_ENCRYPTION_KEY }}
          # #564: new secret, must be added under repo Settings -> Secrets
          # before this deploy step will have a real value -- same
          # generate-and-store convention as POSTGRES_PASSWORD etc.
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          # #531 (original) / task-fix-deploy-secret-rotation-put-noop
          # (2026-10-14, current approach): two of the machine
          # service-account clients (lis-onboarding, lis-platform-analytics)
          # need a real secret, not infra/keycloak/lis-realm.json's checked-in
          # dev-only placeholder (`dev-only-lis-<name>-secret`), which that
          # file re-imports verbatim on every deploy. Originally this tried
          # to *pin* a chosen GitHub-repo-secret value into Keycloak via a
          # full-representation client PUT -- confirmed live, repeatedly,
          # that this PUT silently does not update the credential Keycloak
          # actually validates against (only the dedicated regenerate
          # endpoint does), so both clients ran on the dev-only placeholder
          # on every real deploy despite the PUT reporting success. Fixed by
          # abandoning pinning entirely: the client-secret rotation block
          # below regenerates each client's secret via that proven-working
          # endpoint and appends the *real* resulting value to this same
          # .env file directly -- Keycloak is now the source of truth each
          # deploy, so the two can never silently disagree. Neither
          # ONBOARDING_CLIENT_SECRET nor PLATFORM_ANALYTICS_CLIENT_SECRET is
          # a GitHub repo secret anymore; lis-gateway/lis-interop remain
          # deliberately excluded, neither deployed to staging yet.
          ENVEOF
          # Appended separately, not inside the quoted heredoc above -- these
          # need real bash variable expansion (computed this run, not a GH
          # secret), while the heredoc stays single-quoted so none of the
          # actual secrets above are ever subject to bash expansion.
          echo "KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL}" >> .env
          echo "KEYCLOAK_ISSUER_URL=${KEYCLOAK_ISSUER_URL}" >> .env
          echo "PUBLIC_APP_URL=${PUBLIC_APP_URL}" >> .env

          docker compose stop api web < /dev/null || true

          # Keycloak has no persisted data volume here (only the realm
          # import *file* is bind-mounted, not a data directory) -- it
          # falls back to an embedded, ephemeral store living in the
          # container's own writable layer. A plain stop+up leaves that
          # same container (and its already-imported "lis" realm) intact,
          # so --import-realm silently skips re-importing on every restart
          # -- any change to lis-realm.json (roles, client redirect URIs,
          # anything) would deploy successfully but never actually take
          # effect. Confirmed live this session: a redirectUris fix sat
          # correctly in the file through a full green deploy and still
          # didn't work until the container was explicitly removed (not
          # just stopped) on the droplet by hand. rm -f -s here makes every
          # deploy do that automatically -- keycloak state is meant to be
          # fully rebuilt from lis-realm.json each time, same as api/web
          # already get fresh containers from freshly-pulled images.
          docker compose rm -f -s keycloak < /dev/null || true

          # Prune before pulling, not just after a successful deploy (see
          # the end-of-job prune step's own comment) -- belt and suspenders:
          # if: always() on that step only helps when the job actually
          # reaches it; a prune here too means even a run that fails before
          # that point, or gets cancelled entirely, doesn't leave the *next*
          # attempt starting from a fuller disk than it needs to. Confirmed
          # directly this was worth doing: 8 failed attempts during #188's
          # iteration exhausted the disk (16.65GB reclaimed on manual
          # cleanup) despite none of those individual failures being a disk
          # problem themselves.
          docker image prune -a -f < /dev/null || true

          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} < /dev/null
          docker compose pull < /dev/null
          docker pull ghcr.io/${{ github.repository_owner }}/lis-platform-migrator:latest < /dev/null

          docker compose up -d postgres < /dev/null

          ready=false
          for i in $(seq 1 24); do
            if docker compose exec -T postgres pg_isready -U postgres < /dev/null >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "Postgres did not become ready in time" >&2
            exit 1
          fi

          set -a
          . ./.env
          set +a

          docker run --rm --memory=192m --network lis_staging_net \
            -e DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/lis" \
            "ghcr.io/${{ github.repository_owner }}/lis-platform-migrator:latest" \
            pnpm --filter @lis/db migrate < /dev/null

          # psql's `:'var'` colon-interpolation (set via -v) did not fire
          # when combined with -c in practice here -- ended up with the
          # literal text `:'pw'` reaching the SQL parser (syntax error at
          # or near ":"). Sidestep psql's own interpolation entirely: let
          # bash substitute the real password (already proven safe -- the
          # same mechanism builds DATABASE_URL above) into the SQL text via
          # an *unquoted*, command-specific heredoc, which is a deliberate
          # explicit stdin redirect for this one command (same safety
          # rationale as the seed step's `< seed/....sql` below) and does
          # not reintroduce the outer-script stdin-consumption bug.
          docker compose exec -T postgres psql -U postgres -d lis -v ON_ERROR_STOP=1 <<PSQLEOF
          ALTER ROLE lis_app WITH PASSWORD '$LIS_APP_DB_PASSWORD';
          ALTER ROLE lis_scheduler WITH PASSWORD '$SCHEDULER_DB_PASSWORD';
          PSQLEOF

          # #397 / ADR-0022: every discipline seed file now guards its own
          # inserts with WHERE NOT EXISTS (chemistry-catalog.sql and
          # haematology-catalog.sql both do), so this step runs every file
          # unconditionally on every deploy instead of gating on "does any
          # seed data exist at all" -- that gate silently skipped every
          # discipline past the first ever since it couldn't tell "chemistry
          # is seeded" from "haematology is seeded". Re-running an
          # already-seeded file previously hit a duplicate-key error (run
          # 30637495583) before these per-file guards existed; do not remove
          # a file's own guards without re-adding an equivalent one.
          #
          # Non-fatal by design (close report Finding B, session 28,
          # 2026-08-09): this step used to be a bare command under this
          # script's own `set -e`, which -- combined with api/web already
          # being stopped above -- meant a single seed-data bug took the
          # *entire* site down (issue #410, two real outages the same day)
          # rather than just leaving catalog data incomplete for that one
          # deploy. Same category of failure the Keycloak block below this
          # one was already fixed for on 2026-08-03, for the identical
          # reason -- this step just never got the same treatment until now.
          # `if ! <cmd>; then ...; fi` -- not a bare command -- is what
          # survives under `set -e` here, same idiom the Keycloak block uses.
          if ! docker compose exec -T postgres psql -U postgres -d lis \
              -v ON_ERROR_STOP=1 -f - < seed/chemistry-catalog.sql; then
            echo "WARNING: chemistry-catalog.sql seed failed -- catalog data may be incomplete this deploy, api/web will still restart" >&2
          fi
          if ! docker compose exec -T postgres psql -U postgres -d lis \
              -v ON_ERROR_STOP=1 -f - < seed/haematology-catalog.sql; then
            echo "WARNING: haematology-catalog.sql seed failed -- catalog data may be incomplete this deploy, api/web will still restart" >&2
          fi
          if ! docker compose exec -T postgres psql -U postgres -d lis \
              -v ON_ERROR_STOP=1 -f - < seed/microbiology-catalog.sql; then
            echo "WARNING: microbiology-catalog.sql seed failed -- catalog data may be incomplete this deploy, api/web will still restart" >&2
          fi

          docker compose up -d valkey keycloak < /dev/null
          REMOTE

      # task-remove-tailscale-fix-onboarding-role-mapper (2026-10-17): split
      # out of the "Pull and restart on droplet" step above -- adding the
      # new role-grant block below pushed that one `run:` block's total text
      # past GitHub Actions' own undocumented 21000-character expression-
      # scan limit per step (confirmed live: `gh workflow run` failed
      # outright with "Exceeded max expression length 21000", a distinct
      # failure class from the literal-`${{ }}`-in-a-comment bug this file's
      # own git history already documents elsewhere -- actionlint does not
      # check for this specific GitHub-side limit, so a clean actionlint run
      # does not guarantee a `run:` block is under it). Two separate SSH
      # invocations share the same droplet filesystem state (.env, the
      # already-started containers) fine -- nothing here depends on shell
      # state surviving between steps, only files and container state, both
      # of which persist on the droplet itself.
      - name: Keycloak post-import fixups, restart api/web/nginx
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/lis

          # #256: unmanagedAttributePolicy must be ENABLED on the realm's
          # User Profile for the custom tenant_id attribute to survive any
          # live admin write -- the declarative User Profile silently drops
          # unmanaged attributes otherwise (authentication Skill, entries
          # #7-#10; confirmed live via a raw Admin REST API round-trip that
          # showed the write genuinely dropped server-side, not a display
          # quirk). Keycloak has no persisted data volume on this droplet
          # (see the `docker compose rm -f -s keycloak` comment above), so
          # this must be re-applied after every deploy's recreate, not set
          # once by hand -- that manual, one-time version is exactly what
          # this step replaces. Reuses the same GET/merge/PUT sequence
          # already proven working against this real realm
          # (scripts/feat009-staging-verify.md Step 1), run here against the
          # droplet's own host-local :8080 listener instead of the
          # droplet-console session that mechanism originally needed.
          # Idempotent -- re-PUTting the same value is a no-op.
          #
          # Non-fatal by design (changed 2026-08-03): this whole block used
          # to `exit 1` on any failure here, which -- combined with api/web
          # already being stopped above -- meant a single transient Keycloak
          # hiccup took the *entire* site down (502, api/web never
          # restarted) rather than just leaving unmanagedAttributePolicy
          # unpatched for this one deploy. Confirmed real, not hypothetical:
          # a deploy this same day hit exactly this -- the lightweight
          # readiness probe below passed, but the token-endpoint call
          # (heavier: a real password check, right after --import-realm's
          # own hashing work) timed out once, and the whole job died with
          # api/web left stopped until a human noticed and reran it. Realm/
          # client config (what api/web actually need to function) is
          # already live as soon as Keycloak's own --import-realm completes,
          # independent of this admin-API dance -- so api/web restarting
          # doesn't actually depend on this block succeeding. A skipped
          # unmanagedAttributePolicy re-apply is a real, visible gap (a live
          # admin write of a custom attribute would silently drop it) but a
          # far smaller failure than a full outage, and it self-heals on the
          # next successful deploy.
          keycloak_healthy=false
          for i in $(seq 1 40); do
            if curl -sSf --connect-timeout 5 --max-time 5 http://localhost:8080/realms/master/.well-known/openid-configuration < /dev/null >/dev/null 2>&1; then
              keycloak_healthy=true
              break
            fi
            sleep 5
          done
          if [ "$keycloak_healthy" != "true" ]; then
            echo "WARNING: Keycloak's internal admin API did not become ready in time -- skipping unmanagedAttributePolicy re-apply this deploy, api/web will still restart" >&2
          else
            ADMIN_TOKEN=$(curl -sSf --connect-timeout 10 --max-time 10 \
              --data-urlencode "grant_type=password" --data-urlencode "client_id=admin-cli" \
              --data-urlencode "username=admin" --data-urlencode "password=$KEYCLOAK_ADMIN_PASSWORD" \
              http://localhost:8080/realms/master/protocol/openid-connect/token < /dev/null | jq -r '.access_token // empty' || true)
            if [ -z "${ADMIN_TOKEN:-}" ]; then
              echo "WARNING: failed to obtain a Keycloak admin token -- skipping unmanagedAttributePolicy re-apply this deploy, api/web will still restart" >&2
            else
              PROFILE=$(curl -sSf --connect-timeout 10 --max-time 10 http://localhost:8080/admin/realms/lis/users/profile \
                -H "Authorization: Bearer $ADMIN_TOKEN" < /dev/null || true)
              if [ -z "$PROFILE" ]; then
                echo "WARNING: failed to fetch Keycloak's User Profile -- skipping unmanagedAttributePolicy re-apply this deploy, api/web will still restart" >&2
              else
                NEW_PROFILE=$(echo "$PROFILE" | jq '. + {unmanagedAttributePolicy: "ENABLED"}')
                curl -sS --connect-timeout 10 --max-time 10 -X PUT http://localhost:8080/admin/realms/lis/users/profile \
                  -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
                  -d "$NEW_PROFILE" -w "\nunmanagedAttributePolicy PUT: HTTP %{http_code}\n" < /dev/null || \
                  echo "WARNING: unmanagedAttributePolicy PUT failed -- api/web will still restart" >&2
              fi

              # task-remove-tailscale-fix-onboarding-role-mapper (2026-10-17):
              # service-account-lis-onboarding's role mapping (manage-users/
              # view-realm on realm-management -- the narrowest grant that
              # can create a real Keycloak user, ADR-0040) lives inside
              # infra/keycloak/lis-realm.json's top-level `users` array in
              # Keycloak's own realm-export format. The "Strip local/CI-only
              # test user" step above deliberately deletes that whole array
              # before --import-realm ever sees it (no baked-in test
              # accounts on a network-reachable droplet) -- which also
              # strips this service account's own role grant as
              # unintended collateral damage. Confirmed live: even with the
              # client-role protocol mapper fix (lis-realm.json's "roles"
              # client scope), a fresh import's service account carries no
              # realm-management roles at all, and every Admin API call it
              # makes 403s. Re-granted here, every deploy, matching the
              # non-fatal warn-don't-fail shape every other step in this
              # block already uses -- a skipped re-grant breaks onboarding
              # for this one deploy, not the whole site.
              SA_USER_ID=$(curl -sSf --connect-timeout 10 --max-time 10 \
                "http://localhost:8080/admin/realms/lis/clients?clientId=lis-onboarding" \
                -H "Authorization: Bearer $ADMIN_TOKEN" < /dev/null | jq -r '.[0].id // empty' || true)
              if [ -n "$SA_USER_ID" ]; then
                SA_USER_ID=$(curl -sSf --connect-timeout 10 --max-time 10 \
                  "http://localhost:8080/admin/realms/lis/clients/$SA_USER_ID/service-account-user" \
                  -H "Authorization: Bearer $ADMIN_TOKEN" < /dev/null | jq -r '.id // empty' || true)
              fi
              REALM_MGMT_UUID=$(curl -sSf --connect-timeout 10 --max-time 10 \
                "http://localhost:8080/admin/realms/lis/clients?clientId=realm-management" \
                -H "Authorization: Bearer $ADMIN_TOKEN" < /dev/null | jq -r '.[0].id // empty' || true)
              if [ -z "$SA_USER_ID" ] || [ -z "$REALM_MGMT_UUID" ]; then
                echo "WARNING: could not resolve lis-onboarding's service-account user or the realm-management client -- skipping its role grant this deploy, POST /onboarding/signup will 403" >&2
              else
                ROLES_JSON="["
                FIRST=true
                for ROLE_NAME in manage-users view-realm; do
                  ROLE_REP=$(curl -sSf --connect-timeout 10 --max-time 10 \
                    "http://localhost:8080/admin/realms/lis/clients/$REALM_MGMT_UUID/roles/$ROLE_NAME" \
                    -H "Authorization: Bearer $ADMIN_TOKEN" < /dev/null || true)
                  if [ -z "$ROLE_REP" ]; then
                    echo "WARNING: could not resolve realm-management role '$ROLE_NAME' -- its grant will be skipped this deploy" >&2
                    continue
                  fi
                  if [ "$FIRST" = "true" ]; then FIRST=false; else ROLES_JSON="$ROLES_JSON,"; fi
                  ROLES_JSON="$ROLES_JSON$ROLE_REP"
                done
                ROLES_JSON="$ROLES_JSON]"
                curl -sS --connect-timeout 10 --max-time 10 -X POST \
                  "http://localhost:8080/admin/realms/lis/users/$SA_USER_ID/role-mappings/clients/$REALM_MGMT_UUID" \
                  -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
                  -d "$ROLES_JSON" -w "\nlis-onboarding role grant: HTTP %{http_code}\n" < /dev/null || \
                  echo "WARNING: lis-onboarding role grant POST failed -- POST /onboarding/signup will 403 this deploy" >&2
              fi

              # task-fix-deploy-secret-rotation-put-noop (2026-10-14):
              # infra/keycloak/lis-realm.json's per-client `secret` field is
              # a checked-in dev-only placeholder, imported into this real
              # Keycloak verbatim by --import-realm above -- same
              # must-reapply-every-deploy shape as unmanagedAttributePolicy
              # just above (Keycloak has no persisted volume on this
              # droplet, see the `docker compose rm -f -s keycloak` comment
              # above; entry #8/#10, authentication Skill).
              #
              # Originally (#531) this tried to *pin* each client's secret
              # to a chosen GitHub-repo-secret value via a full-
              # representation GET/merge/PUT. Confirmed live, repeatedly,
              # against the real droplet: that PUT returns 204 and even the
              # GET-based client-secret-length endpoint reflects the new
              # value, but the credential Keycloak actually validates
              # against for client_credentials/password grants never
              # changes -- both clients silently ran on the dev-only
              # placeholder on every real deploy despite this step
              # "succeeding." Only the dedicated regenerate endpoint below
              # actually updates the auth-usable secret (confirmed the same
              # way: an immediate, real token-endpoint 200 using the value
              # it returns, where the PUT-based value got 401
              # unauthorized_client moments before).
              #
              # Fix: stop pinning entirely. Regenerate each client's secret
              # (Keycloak chooses the value -- no pinning needed since
              # nothing elsewhere needs to predict it in advance) and
              # append the *real* resulting value directly to this same
              # .env file, so Keycloak and api's own env can never silently
              # disagree. ONBOARDING_CLIENT_SECRET/PLATFORM_ANALYTICS_CLIENT_SECRET
              # are no longer GitHub repo secrets -- this is their only
              # source now. Non-fatal by design, same reasoning as
              # unmanagedAttributePolicy above: a skipped regeneration for
              # one deploy leaves that one client's env var missing this
              # deploy (not a site outage -- only that one client's calls
              # fail until the next successful deploy).
              for CLIENT_PAIR in "lis-onboarding:ONBOARDING_CLIENT_SECRET" "lis-platform-analytics:PLATFORM_ANALYTICS_CLIENT_SECRET"; do
                CLIENT_ID="${CLIENT_PAIR%%:*}"
                ENV_VAR_NAME="${CLIENT_PAIR#*:}"
                CLIENT_UUID=$(curl -sSf --connect-timeout 10 --max-time 10 \
                  "http://localhost:8080/admin/realms/lis/clients?clientId=$CLIENT_ID" \
                  -H "Authorization: Bearer $ADMIN_TOKEN" < /dev/null | jq -r '.[0].id // empty' || true)
                if [ -z "$CLIENT_UUID" ]; then
                  echo "WARNING: could not resolve Keycloak client UUID for $CLIENT_ID -- skipping its secret regeneration this deploy, $ENV_VAR_NAME will be missing from .env" >&2
                  continue
                fi
                NEW_SECRET=$(curl -sSf --connect-timeout 10 --max-time 10 -X POST \
                  "http://localhost:8080/admin/realms/lis/clients/$CLIENT_UUID/client-secret" \
                  -H "Authorization: Bearer $ADMIN_TOKEN" < /dev/null | jq -r '.value // empty' || true)
                if [ -z "$NEW_SECRET" ]; then
                  echo "WARNING: could not regenerate secret for $CLIENT_ID -- skipping, $ENV_VAR_NAME will be missing from .env this deploy" >&2
                  continue
                fi
                echo "${ENV_VAR_NAME}=${NEW_SECRET}" >> .env
                echo "$CLIENT_ID secret regenerated and written to .env"
              done
            fi
          fi

          # task-remove-tailscale-fix-onboarding-role-mapper (2026-10-17):
          # api/web get their extra_hosts override (routes their own
          # server-side OIDC discovery calls to siamas-caddy's container IP
          # -- see docker-compose.lis-public.yml's own header comment) from
          # the overlay file, not the base compose file alone -- both -f
          # flags are required here, not optional. nginx (the overlay's own
          # new service, public-domain-only, no host port published) is
          # force-recreated in the same call rather than left running from a
          # prior deploy, matching keycloak's own full-rebuild policy above:
          # picks up this deploy's freshly-copied nginx-public.conf instead
          # of silently keeping a stale one if that file ever changes.
          # Replaces the old `tailscale serve --bg` lines entirely -- TLS
          # termination is siamas-caddy's job now, not this droplet's.
          docker compose -f docker-compose.yml -f docker-compose.lis-public.yml \
            up -d --force-recreate api web nginx < /dev/null
          REMOTE

      - name: Smoke test (api, internal)
        run: |
          # api has no host port mapping since #188 (never browser-facing,
          # no reason to expose it) -- check via docker exec against the
          # container's own loopback instead of the droplet's. Node's own
          # http module, not curl -- never confirmed curl exists in this
          # slim runtime image, and Node always does.
          ssh -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} '
            cd /opt/lis
            for i in $(seq 1 10); do
              if docker compose exec -T api node -e "require(\"http\").get(\"http://localhost:4000/health\", r => process.exit(r.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))" < /dev/null; then
                exit 0
              fi
              echo "api health check attempt $i failed, retrying in 5s..."
              sleep 5
            done
            echo "api health check did not succeed after 10 attempts"
            exit 1
          '

      - name: Smoke test (web + Keycloak, real HTTPS over the public domain)
        run: |
          # task-remove-tailscale-fix-onboarding-role-mapper (2026-10-17):
          # checks the same public HTTPS paths a real browser would use --
          # no hostname discovery needed anymore, secrets.STAGING_PUBLIC_DOMAIN
          # is fixed. A green step here is real evidence the overlay
          # (extra_hosts + nginx + siamas-caddy) and KEYCLOAK_ISSUER_URL
          # actually agree with each other, not just that the config looks
          # right. Keycloak is checked on the *same* domain/port as the app
          # now (infra/nginx-public.conf routes /realms/ to keycloak:8080 on
          # the one public listener) -- the old setup's separate :8443 check
          # no longer applies.
          if [ -z "${{ secrets.STAGING_PUBLIC_DOMAIN }}" ]; then
            echo "secrets.STAGING_PUBLIC_DOMAIN is not set" >&2
            exit 1
          fi
          PUBLIC_DOMAIN="${{ secrets.STAGING_PUBLIC_DOMAIN }}"
          echo "Checking against https://${PUBLIC_DOMAIN}"

          # --connect-timeout/--max-time: without these, a curl that can't
          # get any response (as opposed to a fast rejection) hangs on the
          # OS's own default TCP connect timeout per attempt -- confirmed
          # for real on this task's second live deploy attempt (run
          # 30684628865): each of the 10 web-check attempts took ~2m19s
          # instead of the intended ~5s, turning a should-be ~100s failure
          # into a 23-minute one. 10s is generous for a real HTTPS request;
          # a real success should complete in well under 1s.
          #
          # -sS not -sf: plain -s silences curl's own error text along with
          # its progress meter, leaving nothing but a generic "attempt N
          # failed" in the log -- confirmed unhelpful across three real
          # failed attempts on this task so far (HTTPS Certificates now
          # enabled, timeout fixed, still failing for an as-yet-unknown
          # reason). -S keeps the actual error (e.g. "Failed to connect",
          # "SSL certificate problem") visible on stderr while still
          # suppressing the progress meter.
          for i in $(seq 1 10); do
            if curl -sSf --connect-timeout 10 --max-time 10 "https://${PUBLIC_DOMAIN}/" > /dev/null; then
              break
            fi
            echo "web check attempt $i failed, retrying in 5s..."
            sleep 5
            if [ "$i" = "10" ]; then
              echo "web did not become reachable over HTTPS after 10 attempts" >&2
              exit 1
            fi
          done

          # 40 attempts, not 20 -- confirmed directly via droplet console
          # access (docker compose logs keycloak) on #188's 10th live
          # deploy attempt: Keycloak was NOT crash-looping, it genuinely
          # boots successfully, just slowly -- "Keycloak 26.0.8 ... started
          # in 91.638s" (the previous 20x5s=100s window's own real gap: the
          # smoke test gave up at the 100s mark while Keycloak didn't
          # finish until ~40s later). ~51s of that 91.6s was a one-time
          # "Quarkus augmentation" step triggered by that run's config
          # actually changing -- likely won't recur on a stable config, but
          # not relied on; this window has real margin either way. Same
          # class of finding as #189's own smoke-test-timing fix elsewhere
          # in this file.
          for i in $(seq 1 40); do
            if curl -sSf --connect-timeout 10 --max-time 10 "https://${PUBLIC_DOMAIN}/realms/lis/.well-known/openid-configuration" > /dev/null; then
              exit 0
            fi
            echo "Keycloak check attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Keycloak did not become reachable over HTTPS after 40 attempts" >&2
          exit 1

      - name: Prune unused Docker images on droplet
        # Real bug, found on #188's live deploy attempts: this step only
        # ran after a *successful* deploy, so any run failing before this
        # point (as several did while iterating on #188 -- ACL/proxy/
        # KC_HTTP_ENABLED issues, none of them disk-related) left that
        # attempt's freshly-pulled images uncleaned. 8 failed attempts in a
        # row exhausted the disk this way ("no space left on device")
        # despite none of the individual failures being a disk problem --
        # if: always() so this genuinely always runs, regardless of what
        # failed earlier in the job.
        if: always()
        run: |
          # Repeated deploys in a single day (this pipeline pushes fresh
          # :latest images on every push to main) leave superseded,
          # unreferenced images behind -- Docker/containerd never clean
          # these up automatically. Confirmed directly: 131 images, only 5
          # active, 18.44GB (89%) reclaimable, which alone took the
          # droplet's root disk from 100% full to 25% used.
          # -a removes ALL images with zero containers referencing them
          # (not just dangling/untagged ones), not just the images built by
          # this workflow; -f skips the confirmation prompt. Never touches
          # images used by running or stopped containers, or any volume.
          ssh -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} \
            'docker image prune -a -f' || true

      - name: Clean up deploy key
        if: always()
        run: rm -f deploy_key
